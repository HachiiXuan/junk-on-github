<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEEL//RHYTHM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>STEEL<span>//</span>RHYTHM</h1>

  <button id="playBtn" data-i18n="btn.play">Play</button>

  <div class="ctl">
    <label data-i18n="label.bpm">BPM</label>
    <input id="bpm" type="range" min="40" max="200" step="1" value="100">
    <b id="bpmVal">100</b>
  </div>

  <div class="ctl">
    <label data-i18n="label.master">Master</label>
    <input id="master" type="range" min="0" max="1" step="0.01" value="0.8">
    <b id="masterVal">80%</b>
  </div>

  <div class="grow"></div>

  <div class="lang-switch" id="langSwitch">
    <button data-lang="en" class="active">EN</button>
    <button data-lang="zh">中</button>
  </div>

  <button id="presetBtn" data-i18n="btn.preset">Preset</button>
  <button id="clearBtn"  data-i18n="btn.clear">Clear</button>

  <div class="export-wrap">
    <button id="exportBtn" data-i18n="btn.export">Export WAV</button>
    <div id="exportPanel" class="export-panel">
      <div class="ep-row">
        <label>
          <input type="radio" name="expMode" value="duration" checked>
          <span data-i18n="export.mode.fixed">Fixed length</span>
        </label>
        <input type="number" id="expDur" value="12" min="1" max="300" step="1">
        <span data-i18n="export.unit.sec">sec</span>
      </div>
      <div class="ep-row">
        <label>
          <input type="radio" name="expMode" value="interval">
          <span data-i18n="export.mode.interval">By interval</span>
        </label>
        <span class="ep-hint" id="expIntervalHint">—</span>
      </div>
      <button id="expGo" class="ep-go" data-i18n="export.go">Export WAV</button>
    </div>
  </div>
</header>

<section class="viz-wrap">
  <canvas id="viz"></canvas>
</section>

<div class="workspace">

  <aside class="palette">
    <div class="palette-title" data-i18n="palette.add">Add Track →</div>
    <div id="paletteBtns" class="palette-btns"></div>
  </aside>

  <main id="tracks" class="tracks-col">
    <div class="empty" id="emptyHint"
         data-i18n="tracks.empty">No tracks yet · Click a sound on the left to start building your factory</div>
  </main>

</div>

<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/tracks.js"></script>
<script src="js/viz.js"></script>
<script src="js/export.js"></script>
<script src="js/main.js"></script>
</body>
</html>
